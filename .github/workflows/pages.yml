name: Build and publish Faborn beta

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: faborn-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install native transport test headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Check the committed beta
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_resolver.py
          git diff --exit-code -- lib/
          node --test tests/test_*.js
          node --check ukr-by-faborn.js
      - name: Refresh reviewed sources and HLS manifests
        run: python scripts/build_catalog.py
      - name: Validate refreshed catalog
        run: python scripts/validate.py
      - name: Assemble static Pages artifact
        run: |
          mkdir -p _site/assets _site/data _site/lib
          cp ukr-by-faborn.js index.html .nojekyll _site/
          cp assets/icon.svg _site/assets/
          cp -R assets/studios _site/assets/
          cp data/catalog.json data/status.json data/aerial.json _site/data/
          cp lib/kinobase.js lib/faborn-ui.js lib/faborn-screensaver.js lib/faborn-skip.js lib/STARFIELD-LICENSE lib/SAVER-WARP-LICENSE lib/SAVER-MATRIX-LICENSE lib/ACORN-LICENSE lib/AERIAL-LICENSE _site/lib/
          cp -R lib/4klab _site/lib/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
